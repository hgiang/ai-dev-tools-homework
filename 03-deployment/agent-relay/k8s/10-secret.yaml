# LOCAL DEVELOPMENT CREDENTIALS ONLY.
#
# These values are committed on purpose so `kubectl apply -f k8s/` reproduces
# the homework cluster in one command.  They are safe only because this cluster
# is a throwaway kind node on a laptop and PostgreSQL is never published
# outside it.  For anything real, delete this file and create the Secret out of
# band so the password never enters git:
#
#   kubectl -n agent-relay create secret generic postgres \
#     --from-literal=POSTGRES_USER=relay \
#     --from-literal=POSTGRES_DB=relay \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
#
# Note that a Secret is only base64-encoded, not encrypted: anyone who can read
# Secrets in this namespace can read the password.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: agent-relay
type: Opaque
stringData:
  POSTGRES_USER: relay
  POSTGRES_PASSWORD: relay
  POSTGRES_DB: relay
  # The API reads this one.  The host is "postgres", the Service name below --
  # exactly as in compose.yaml, for the same reason: it is the DNS name the
  # cluster resolves to the database Pod.
  RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
